<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#075985" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>HIU HRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      let previousTitle = document.title;
      let titleInterval;

      window.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Lấy tiêu đề hiện tại (do React có thể đã thay đổi)
          previousTitle = document.title;
          let scrollTitle = previousTitle + ' • ';
          // Hiệu ứng chữ chạy (Marquee) dựa trên tiêu đề thật của trang
          titleInterval = setInterval(() => {
            scrollTitle = scrollTitle.substring(1) + scrollTitle[0];
            document.title = scrollTitle;
          }, 400);
        } else {
          // Dừng hiệu ứng và trả lại tiêu đề gốc
          clearInterval(titleInterval);
          document.title = previousTitle;
        }
      });
    </script>
  </body>
</html>
